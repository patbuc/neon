[package]
name = "neon"
version = "0.0.1"
edition = "2021"
description = "A toy language you didn't wait for"
repository = "https://github.com/patbuc/neon"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
colored = "3.0.0"
lazy_static = "1.5.0"
env_logger = "0.11.8"
log = "0.4.27"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
ordered-float = { version = "4.6.0", features = ["serde"] }
strsim = "0.11"
indexmap = "2.12.1"

[dev-dependencies]
datatest-stable = "0.3.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[[test]]
name = "neon_scripts"
harness = false

[features]
disassemble = []
opcode-stats = []

[lints.clippy]
print_stdout = "deny"
print_stderr = "deny"